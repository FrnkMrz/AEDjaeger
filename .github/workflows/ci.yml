name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_workers:
        description: "Den geprüften main-Stand auf workers.dev veröffentlichen"
        required: true
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Prüft nur, ob alle Dateien so formatiert sind, wie Biome es vorgibt.
      # Bei Abweichungen lokal `npm run format` ausführen und das Ergebnis committen.
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run worker:check
      - run: npm run test:worker-http
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

  deploy:
    # Nach einem Push auf main (zum Beispiel durch einen Merge) wird nach grüner
    # CI automatisch deployt. Manuelle Läufe brauchen weiterhin eine Bestätigung.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy_to_workers)
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://aedjaeger.aedjaeger.workers.dev
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run worker:check
      - name: Ausstehende D1-Migrationen blockieren den Deploy
        run: npm run check:d1-migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Worker auf Cloudflare bereitstellen
        run: npm run worker:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
