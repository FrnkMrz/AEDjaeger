name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_to_workers:
        description: "Den geprüften main-Stand auf workers.dev veröffentlichen"
        required: true
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run worker:check
      - run: npm run test:worker-http
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    # Ein Merge allein veröffentlicht nichts. Der Betreiber startet den Workflow
    # bewusst auf main und bestätigt den Deploy im Eingabefeld.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy_to_workers
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://aedjaeger.aedjaeger.workers.dev
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run worker:check
      - name: Worker auf Cloudflare bereitstellen
        run: npm run worker:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
